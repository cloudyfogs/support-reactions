<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Support reactions explorer</title>
<style>
  :root{
    --bg:#f5f4f0; --surface:#ffffff; --text:#1c1c1a; --text-2:#5f5e58;
    --border:#dedcd2; --border-strong:#c3c1b4;
    --toggle-on-bg:#1c1c1a; --toggle-on-text:#f5f4f0;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:#171715; --surface:#232320; --text:#f1efe8; --text-2:#b4b2a9;
      --border:#3a3a35; --border-strong:#4c4c46;
      --toggle-on-bg:#f1efe8; --toggle-on-text:#171715;
    }
  }
  :root[data-theme="dark"]{
    --bg:#171715; --surface:#232320; --text:#f1efe8; --text-2:#b4b2a9;
    --border:#3a3a35; --border-strong:#4c4c46;
    --toggle-on-bg:#f1efe8; --toggle-on-text:#171715;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  .switchbar{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:10px 12px; border-bottom:1px solid var(--border);
    background:var(--surface);
  }
  .switchbar .group{
    display:inline-flex; border:1px solid var(--border-strong); border-radius:999px;
    padding:3px; gap:3px; background:var(--bg);
  }
  .switchbar button{
    font:inherit; font-size:13.5px; font-weight:600; cursor:pointer;
    border:none; border-radius:999px; padding:7px 18px;
    background:transparent; color:var(--text-2);
    transition:background .15s, color .15s;
  }
  .switchbar button.active{
    background:var(--toggle-on-bg); color:var(--toggle-on-text);
  }
  .switchbar button:not(.active):hover{ color:var(--text); }
  .frames{ position:relative; flex:1 1 auto; min-height:0; }
  .frames iframe{
    position:absolute; inset:0; width:100%; height:100%; border:none; display:none; background:var(--bg);
  }
  .frames iframe.active{ display:block; }
</style>
</head>
<body>

<div class="switchbar">
  <div class="group" role="tablist" aria-label="View mode">
    <button id="btn2d" class="active" role="tab" aria-selected="true">2D</button>
    <button id="btn3d" role="tab" aria-selected="false">3D</button>
  </div>
</div>

<div class="frames">
  <iframe id="frame2d" class="active" title="Support reactions explorer (2D)"></iframe>
  <iframe id="frame3d" title="Support reactions explorer (3D)"></iframe>
</div>

<script>
(function(){
  function b64ToUtf8(b64){
    var binary = atob(b64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  var html2d = b64ToUtf8(document.getElementById('src2d').textContent.trim());
  var html3d = b64ToUtf8(document.getElementById('src3d').textContent.trim());

  var frame2d = document.getElementById('frame2d');
  var frame3d = document.getElementById('frame3d');
  var btn2d = document.getElementById('btn2d');
  var btn3d = document.getElementById('btn3d');

  var loaded2d = false, loaded3d = false;

  function ensureLoaded(which){
    if (which === '2d' && !loaded2d){
      frame2d.srcdoc = html2d;
      loaded2d = true;
    }
    if (which === '3d' && !loaded3d){
      frame3d.srcdoc = html3d;
      loaded3d = true;
    }
  }

  function show(which){
    var is2d = which === '2d';
    frame2d.classList.toggle('active', is2d);
    frame3d.classList.toggle('active', !is2d);
    btn2d.classList.toggle('active', is2d);
    btn3d.classList.toggle('active', !is2d);
    btn2d.setAttribute('aria-selected', String(is2d));
    btn3d.setAttribute('aria-selected', String(!is2d));
    ensureLoaded(which);
  }

  btn2d.addEventListener('click', function(){ show('2d'); });
  btn3d.addEventListener('click', function(){ show('3d'); });

  // Load the initial (2D) view immediately; defer the 3D view until requested
  // so its WebGL scene doesn't spin up until the user actually switches to it.
  ensureLoaded('2d');
})();
</script>
</body>
</html>
